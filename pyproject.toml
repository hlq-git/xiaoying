[project]
name = "xiaoying-scheduling-agent"
version = "0.1.0"
description = "Material review and draft scheduling agent"
requires-python = ">=3.11"
dependencies = ["pydantic-ai-slim[openai]==1.66.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_agent"]
